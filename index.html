    <!-- Privacy-Aware Analytics Loader (Google Analytics GA4 ready) -->
    <script type="text/javascript">
      (function() {
        // To enable Google Analytics, set your GA4 Measurement ID below (e.g. 'G-XXXXXXXXXX')
        var GA_MEASUREMENT_ID = window.__GA_MEASUREMENT_ID__ || '';
        function loadAnalytics() {
          if (!GA_MEASUREMENT_ID || window._gaLoaded) return;
          window._gaLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){ dataLayer.push(arguments); }
          gtag('js', new Date());
          gtag('config', GA_MEASUREMENT_ID);
        }
        if (localStorage.getItem('legacy_cookie_consent') === 'all') {
          loadAnalytics();
        }
        window.addEventListener('cookie_consent_granted', loadAnalytics);
      })();
    </script>
